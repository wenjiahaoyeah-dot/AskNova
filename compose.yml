services:
  asknova:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      PROMETHEUS_PORT: "0"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - asknova-data:/app/data
      - asknova-models:/home/asknova/.cache/chroma
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma-data:/chroma/chroma

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  asknova-data:
  asknova-models:
  redis-data:
  chroma-data:
